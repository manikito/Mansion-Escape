<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mansion Escape</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body class="menu-page">

    <div class="fog fog-one"></div>
    <div class="fog fog-two"></div>

    <main class="menu">

        <div class="ghost">
            👻
        </div>

        <p class="subtitle">
            A Haunted Escape Story
        </p>

        <h1 class="game-title">
            MANSION ESCAPE
        </h1>

        <p class="menu-text">
            Some houses are abandoned for a reason.
        </p>

        <a href="about.html" class="game-button play-button">
            PLAY
        </a>

        <button id="theme-toggle" class="theme-button">
            ☀ LIGHT MODE
        </button>

    </main>

    <script>
        // Load saved theme
        const savedTheme = localStorage.getItem("mansionTheme");

        if (savedTheme === "light") {
            document.body.classList.add("light-mode");
        }

        // Theme button
        const themeButton = document.getElementById("theme-toggle");

        function updateThemeButton() {

            if (document.body.classList.contains("light-mode")) {
                themeButton.textContent = "🌙 DARK MODE";
            } else {
                themeButton.textContent = "☀ LIGHT MODE";
            }

        }

        updateThemeButton();

        themeButton.addEventListener("click", function () {

            document.body.classList.toggle("light-mode");

            if (document.body.classList.contains("light-mode")) {
                localStorage.setItem("mansionTheme", "light");
            } else {
                localStorage.setItem("mansionTheme", "dark");
            }

            updateThemeButton();

        });
    </script>

</body>
</html>
